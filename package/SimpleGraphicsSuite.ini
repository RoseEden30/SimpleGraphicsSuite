; Read at startup, and written back whenever the in-game menu changes a
; setting (needs NativeSystemMenuFramework). Out-of-range values are clamped.

[General]
; Turns every module below off without touching its own settings.
Enabled=1

[AntiAliasing]
Enabled=1
; 0=TAA, 1=FXAA, 2=DLAA (ours). Mutually exclusive: picking
; one forces the others off. TAA and FXAA are the game's own.
Method=0
; TAA deblur. Negative values sharpen texture sampling, 0 leaves them alone.
; Only applies to TAA and DLAA. Range -3.0 to 0.0.
MipLODBias=-0.9

[PostProcessing]
; Doodlum's Vanilla HDR tonemap curve and the colour grading below. The
; other effects (sharpening, motion blur, vignette, LUT) stay independent
; of this switch.
Enabled=1
; AMD FidelityFX RCAS. 0.0 to 1.0, 0 leaves it off.
Sharpening=0.0
; Tonemap curve: 1=channel, 2=peak, 3=average luma, 4=Frostbyte, 5=ACES.
TonemapMethod=4
; Colour grading, matching doodlum's own defaults.
Exposure=0.0
Contrast=1.39
Saturation=1.0
; Bloom, 0.0 to 1.0. Drives a downsample/upsample glow that replaces the
; engine's own flat one. 0 turns it off. Only applies while Enabled above is
; on - the vanilla curve keeps the game's bloom.
BloomIntensity=0.5
; Reads the engine's own motion vector buffer - camera movement and moving
; actors both blur. Forces TAA's temporal mode on while active.
; 0.0 to 1.0, 0=off.
MotionBlurStrength=0.0
; 0.0 to 1.0, 0=off.
Vignette=0.0
; Only show the vignette while sneaking.
VignetteSneakOnly=0
; File name (no extension) from Data/Shaders/SimpleGraphicsSuite/LUTs/.
; Empty means no colour grading LUT.
LUT=
LUTStrength=1.0

[Upscaling]
; Experimental. Renders the 3D scene below native resolution through the
; engine's own dynamic resolution, then reconstructs it with FSR1 (EASU) in
; the post-processing shader. Ignored while FXAA or DLAA is selected -
; both take the resolution back.
Enabled=0
; 0.5 to 1.0.
RenderScale=1.0

[Accessibility]
; Colourblind filter, applied over the finished frame so it corrects the UI
; too. 0=Off, 1=Protanopia, 2=Deuteranopia, 3=Tritanopia, 4=Grayscale.
ColorblindMode=0
ColorblindStrength=1.0

[Reflex]
; NVIDIA only. No effect on AMD or Intel GPUs.
Enabled=1
; Lowers latency without costing frame rate.
LowLatencyMode=1
; Keeps the GPU at max clocks while mostly idle, for a further latency cut
; in CPU-bound scenes - at the cost of power and FPS, so off by default.
LowLatencyBoost=0
; Lets the driver use our per-frame timing markers to optimize further.
UseMarkersToOptimize=0
; Caps the frame rate through Reflex instead of the game's own limiter.
UseFPSLimit=0
; 30 to 240.
FPSLimit=60

[Debug]
; Dev-only diagnostics tab in the menu. Read once at startup, and untouched
; by Reset to defaults.
Enabled=0
